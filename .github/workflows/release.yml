name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # Add new mc/* branches here when supporting new MC versions
        branch: [mc/1.21.1, mc/1.21.4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "mod_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sanitize branch name
        id: branch
        run: echo "safe_name=$(echo '${{ matrix.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: chmod +x gradlew && ./gradlew collectJars -Pmod_version=${{ steps.version.outputs.mod_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.branch.outputs.safe_name }}
          path: quickstackcraft-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: List release files
        run: ls -la quickstackcraft-*.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: quickstackcraft-*.jar
          generate_release_notes: true
