architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Fabric loader for @Environment annotations and mixin dependencies in common
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Architectury API (common module)
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // JEI (compile-only, mod works without JEI)
    modCompileOnlyApi "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"

    // EMI (compile-only, mod works without EMI)
    modCompileOnly "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}:api"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}
