plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.10-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "8.3.0" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.mod_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
}

tasks.register("collectJars") {
    group = "build"
    description = "Copies final jars to project root"
    rootProject.enabled_platforms.split(",").each { platform ->
        dependsOn ":${platform}:build"
    }
    doLast {
        rootProject.enabled_platforms.split(",").each { platform ->
            fileTree("${platform}/build/libs").matching {
                include "${rootProject.archives_base_name}-${rootProject.version}.jar"
                exclude "*-dev-shadow*", "*-sources*"
            }.each { jar ->
                def dest = new File(rootDir, jar.name.replace(rootProject.archives_base_name, "${rootProject.archives_base_name}-${platform}"))
                jar.bytes.with { dest.bytes = it }
                println "  -> ${dest.name}"
            }
        }
    }
}

tasks.register("build") {
    dependsOn "collectJars"
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        archivesName = rootProject.archives_base_name
    }

    repositories {
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.parchmentmc.org/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = targetCompatibility = JavaVersion.toVersion(rootProject.java_version as Integer)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = rootProject.java_version as Integer
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(Jar).configureEach {
        from(rootProject.file("LICENSE")) {
            into "META-INF"
            rename { "LICENSE_QuickStackCraft" }
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }

    processResources {
        def props = [
            mod_id          : rootProject.mod_id,
            mod_name        : rootProject.mod_name,
            mod_version     : rootProject.mod_version,
            mod_authors     : rootProject.mod_authors,
            mod_license     : rootProject.mod_license,
            mod_description : rootProject.mod_description,
            minecraft_version: rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            java_version    : rootProject.java_version,
            architectury_api_version: rootProject.architectury_api_version,
            fabric_api_version: rootProject.fabric_api_version,
            fabric_loader_version: rootProject.fabric_loader_version,
            neoforge_version: rootProject.neoforge_version,
        ]
        inputs.properties(props)

        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
            expand(props)
        }
    }
}
